[package]
name = "swiftcanvas"
version = "0.1.0"
description = "SwiftCanvas — a Windows Xcode-style IDE with live SwiftUI preview"
authors = ["SwiftCanvas"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "swiftcanvas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
